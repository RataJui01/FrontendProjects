<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <title>Payment-landing-page</title>
  </head>
  <body>
    <div class="nav-bar">
      <img src="./assets/starlingbank 1.png" alt="logo" />
      <button class="hide menuBtn"><i class="bx bx-menu"></i></button>
      <button class="hide closeBtn"><i class="bx bx-x"></i></button>
      <ul class="nav-links">
        <li>Features</li>
        <li>Pricing</li>
        <li>Help</li>
        <li>Blog</li>
        <li>About us</li>
        <li class="hide">Login</li>
        <li class="hide">Sign Up</li>
      </ul>
      <div class="login-signup">
        <button class="login-btn">Log In</button>
        <button class="signup-btn">Sign Up</button>
      </div>
    </div>

    <div class="contents">
      <div class="promote-word">
        <p class="subTitle">Start Saving Money</p>
        <p class="title">Smart Credit Card <br />For Your Daily Life.</p>
        <button class="download-btn">
          Download
          <div class="downloadIcon"><i class="bx bx-down-arrow-alt"></i></div>
        </button>
      </div>
      <img src="./assets/prototypeImage.png" />
    </div>
  </body>
  <script src="index.js"></script>
</html>
